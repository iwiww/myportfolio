/* hand-drawn bits use the picture's own coordinates; PAD is the headroom added on top */
function px(x,y,w,h,c){o.fillStyle=c;o.fillRect(x,y+PAD,w,h)}
function dot(x,y,c){o.fillStyle=c;o.fillRect(x,y+PAD,1,1)}
function sprite(name,dx=0,dy=0,clip){ for(const p of SPR[name]){
  if(clip && !clip.has((p[0]+dx)+','+(p[1]+dy))) continue;
  if(!p[2]){ o.clearRect(p[0]+dx,p[1]+dy,1,1); continue; }      // index 0 = see-through
  o.fillStyle=PAL[p[2]-1]; o.fillRect(p[0]+dx,p[1]+dy,1,1); } }
const FACE=new Set(SPR.faceMask.map(p=>p[0]+','+p[1]));
const WHOLE=new Set(['sip','troubled','stretch']);      // poses lifted whole from her references
const HAIR=new Set(SPR.hairMask.map(p=>p[0]+','+p[1]));
function seg(x,y,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay;
  const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy)));
  return Math.hypot(x-(ax+dx*t),y-(ay+dy*t)); }
function arm(ax,ay,bx,by,r=2.6,clip=99){
  const x0=Math.floor(Math.min(ax,bx)-r-1), x1=Math.ceil(Math.max(ax,bx)+r+1);
  const y0=Math.floor(Math.min(ay,by)-r-1), y1=Math.ceil(Math.max(ay,by)+r+1);
  const inn=(x,y)=>y<clip && seg(x,y,ax,ay,bx,by)<=r;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ if(!inn(x,y)) continue;
    const e=!inn(x-1,y)||!inn(x+1,y)||!inn(x,y-1)||(!inn(x,y+1)&&y+1<clip);
    dot(x,y, e?C.swD:(seg(x,y,ax,ay,bx,by)<r*0.35&&x<(ax+bx)/2?C.swL:C.sw)); }
}
function hand(cx,cy){
  for(let y=cy-3;y<=cy+3;y++) for(let x=cx-3;x<=cx+3;x++){
    const dd=Math.hypot(x-cx,y-cy); if(dd>2.6) continue;
    dot(x,y, dd>1.9?C.skinE:(y>cy?C.skinS:C.skin)); }
}
/* an arm: shoulder -> elbow -> wrist, tapering, dark keyline, a lit edge, a ribbed cuff */
function limb(pts,r0,r1,clip=99,under=0){
  const L=[]; let total=0;
  for(let i=1;i<pts.length;i++){ const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); L.push(l); total+=l; }
  const probe=(x,y)=>{ let best=1e9, at=0, acc=0;
    for(let i=1;i<pts.length;i++){ const [ax,ay]=pts[i-1],[bx,by]=pts[i], dx=bx-ax, dy=by-ay;
      const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy)));
      const u=(acc+t*L[i-1])/total, dd=Math.hypot(x-(ax+dx*t),y-(ay+dy*t))-(r0+(r1-r0)*u);
      if(dd<best){ best=dd; at=u; } acc+=L[i-1]; }
    return [best,at]; };
  const inn=(x,y)=>{ if(y>=clip) return false; const [dd,u]=probe(x,y); if(dd>0) return false;
    return !(u<under && HAIR.has(x+','+(y+PAD))); };      // the upper arm goes behind her hair
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  for(let y=Math.floor(Math.min(...ys)-r0-1);y<=Math.ceil(Math.max(...ys)+r0+1);y++)
    for(let x=Math.floor(Math.min(...xs)-r0-1);x<=Math.ceil(Math.max(...xs)+r0+1);x++){
      if(!inn(x,y)) continue;
      const u=probe(x,y)[1];
      const edge=!inn(x-1,y)||!inn(x+1,y)||!inn(x,y-1)||(!inn(x,y+1)&&y+1<clip);
      let c=C.sw;
      if(edge) c=C.swD; else if(u>0.86) c=C.swL; else if(!inn(x-2,y)) c=C.swL;
      dot(x,y,c);
    }
}
/* an open hand, palm out, fingers up; tilt leans the fingers for the wave */
function mitten(cx,cy,tilt){
  const t=tilt?1:0;
  px(cx-2,cy-1,4,3,C.skin); px(cx-2,cy+1,4,1,C.skinS);
  px(cx-2+t,cy-3,4,2,C.skin); px(cx-1+t,cy-4,2,1,C.skin);
  dot(cx+2,cy,C.skin); dot(cx+2,cy+1,C.skinS);
  dot(cx-2+t,cy-3,C.skinE); dot(cx+1+t,cy-3,C.skinE); dot(cx+t,cy-2,C.skinS);
}
/* hands clasped over her head */
function clasp(cx,cy){
  px(cx-2,cy-1,4,1,C.skin); px(cx-3,cy,6,3,C.skin); px(cx-3,cy+3,6,1,C.skinS);
  dot(cx-3,cy,C.skinE); dot(cx+2,cy,C.skinE); dot(cx-1,cy+1,C.skinS); dot(cx+1,cy+1,C.skinS);
}
/* a hand wrapped round the mug handle */
function fist(cx,cy){
  px(cx-1,cy-2,3,4,C.skin); px(cx-1,cy+1,3,1,C.skinS); dot(cx-1,cy-2,C.skinE);
  dot(cx+1,cy-1,C.skinS); dot(cx+1,cy+1,C.skinS);
}

function bubble(x,y,w,h){ px(x+1,y,w-2,h,'#ffffff'); px(x,y+1,w,h-2,'#ffffff');

  dot(x+1,y+h+1,'#ffffff'); dot(x,y+h+2,'#e7dfd5'); }
function zzz(x,y,s,c){ for(let k=0;k<s;k++){ dot(x+k,y,c); dot(x+k,y+s-1,c); } for(let k=1;k<s-1;k++) dot(x+s-1-k,y+k,c); }

/* ---------- state ---------- */
const R=Math.random;
let frame=0, blink=0, nextBlink=26, tapT=0;
let state='work', stT=0, stLen=0, workLeft=48;
const SEQ=['sip','troubled','stretch','look'], LEN={sip:36,troubled:34,stretch:24,look:22}; let seqI=0;
let ptr=null, ptrTTL=0;                          // pointer, in picture coordinates
const cats={cal:{hover:0,love:0}, tab:{hover:0,love:0}};
const HEAD={x:84,y:24};
function go(s,len){ state=s; stT=0; stLen=len; }
const isNear=()=> ptr && (Math.hypot(ptr.x-HEAD.x,ptr.y-HEAD.y)<30 || (ptr.x>=58&&ptr.x<=100&&ptr.y>=-8&&ptr.y<=58));
const overCal=()=> ptr && ptr.x>=2&&ptr.x<=42&&ptr.y>=42&&ptr.y<=60;
const overTab=()=> ptr && ptr.x>=127&&ptr.x<=168&&ptr.y>=45&&ptr.y<=61;

function step(){
  frame++;
  if(tapT>0) tapT--;
  if(ptrTTL>0 && --ptrTTL===0) ptr=null;
  if(blink>0) blink--; else if(--nextBlink<=0){ blink=2; nextBlink=22+(R()*34|0); }
  stT++;
  const near=isNear();
  if(near && state!=='notice' && state!=='greet') go('notice',7);
  else if(!near && (state==='notice'||state==='greet')) go('back',14);
  else if(state==='notice' && stT>=stLen) go('greet',1e9);
  else if(state==='work'){ if(--workLeft<=0){ const s=SEQ[seqI++%SEQ.length]; go(s,LEN[s]); } }
  else if(state!=='greet' && stT>=stLen){ state='work'; workLeft=40+(R()*24|0); }
  updateFace();
  for(const [k,over] of [['cal',overCal()],['tab',overTab()]]){
    const c=cats[k]; if(over) c.hover=6; else if(c.hover>0) c.hover--; if(c.love>0) c.love--; }
}

/* she turns her face a pixel toward the cursor -- slowly, and only when it's well off to one side */
let face=0, faceWant=0, faceHold=0;
function updateFace(){
  let want=0;
  if(state==='look') want = stT<11?-1:1;
  else if(ptr && !WHOLE.has(state)){
    const dx=ptr.x-HEAD.x;
    want = dx>20?1 : dx<-20?-1 : Math.abs(dx)<10?0 : faceWant;   // one pixel is enough; dead band so she doesn't twitch
  }
  if(want!==faceWant){ faceWant=want; faceHold=0; }
  if(face!==faceWant && ++faceHold>=3 && frame%2===0) face+=Math.sign(faceWant-face);   // eases over two steps
}

function draw(){
  const f=frame, t=stT;
  o.clearRect(0,0,W,H);
  if(BG!=='transparent'){ o.fillStyle=BG; o.fillRect(0,0,W,H); }
  o.drawImage(base,0,0);
  sprite('plant',(f%40<20)?0:1,0);
  /* cats */
  if(f%26<13) sprite('calico',0,-1);
  if((f+9)%30<15) sprite('tabby',0,-1);
  if(cats.cal.hover||cats.cal.love) sprite('calOpen');
  if(cats.tab.hover||cats.tab.love) sprite('tabOpen');

  /* what her arms are doing */
  if(state==='sip') sprite('nomug');
  if(state==='work'||state==='look'||state==='back'){ if(f%4<2) sprite('handA',0,-1); else sprite('handB',0,-1); }

  /* face: eyes, lashes, blush, nose and mouth move as one */
  let eyes='open';
  if(state==='greet'||tapT>0||(state==='sip'&&t>4&&t<30)) eyes='happy';
  else if(state==='stretch'||blink>0) eyes='shut';
  const yawn = state==='stretch';
  const fx = face;
  if(!WHOLE.has(state) && (fx || eyes!=='open' || yawn)){
    sprite('fblank');
    if(fx) sprite('edge'+fx);
    sprite(eyes==='open'?'eyes':eyes==='shut'?'eyesShut':'eyesHappy', fx, 0, FACE);
    sprite('cheeks', fx, 0, FACE);
    if(yawn){ px(83+fx,30,3,2,C.mouthD); dot(84+fx,31,C.mouthP); } else sprite('smile', fx, 0, FACE);
  }

  /* poses */
  if(state==='sip'){                                     // from her reference: both hands round the cat mug
    sprite('nomug'); sprite('sipPose');
    sprite('sipSteam',(f%6<3)?0:1,0);
    sprite('sipHeart',0,(f%10<5)?0:-1);
  }
  if(state==='troubled'){                                // from her reference: hand on her forehead, a little storm cloud
    sprite('troubledPose');
    sprite('scribble',(f%4<2)?0:1,(f%8<4)?0:-1);
    if(f%12<9) sprite('puff',(f%12)>>2,-((f%12)>>2));
    if(f%6<4) sprite('tLines');
  }
  if(state==='stretch'){                                 // straight from her reference: fists up, eyes shut, a big yawn
    sprite('stretchPose');
    if(f%8<5) sprite('sparkle');
    if(f%4<2) sprite('lines'); else sprite('lines',0,-1);
  }
  if(state==='greet'){                                   // she stops, smiles at you, a small heart
    if(f%18<12){ const k=f%18; heart(99+(k>>2),2-(k>>1)); }
  }

  /* steam off the mug on the desk */
  if(state!=='sip') for(let i=0;i<3;i++){ const k=(f+i*5)%15, y=46-k; if(y<38) continue;
    dot(57+i*2+Math.round(Math.sin((k+i*3)/3)),y, k<9?'rgba(222,214,204,.85)':'rgba(222,214,204,.4)'); }

  /* the cats sleep on, unless someone is bothering them */
  const ZZ='#b4a79b';
  if(!cats.cal.hover&&!cats.cal.love){ const zc=f%64; if(zc<40){ const k=zc/5|0; zzz(16+(k%2),31-k,3,ZZ); if(k>3) zzz(20,25-(k-4),4,ZZ); } }
  if(!cats.tab.hover&&!cats.tab.love){ const zt=(f+30)%72; if(zt<40){ const k=zt/5|0; zzz(137+(k%2),32-k,3,ZZ); } }
  for(const [k,x,y] of [['cal',30,36],['tab',134,38]]){ const c=cats[k];
    if(c.love>0){ const s=24-c.love; heart(x+(s%2),y-(s>>1)); if(s>6) heart(x+6,y+2-((s-6)>>1)); } }

  /* bubbles */
  if(state==='notice'){ bubble(100,-9,7,9); px(103,-7,1,4,'#6b4a3a'); dot(103,-2,'#6b4a3a'); }
  if(state==='back' && t<11){ bubble(100,-7,9,6); for(let i=0;i<3;i++) if(t>i*2) dot(102+i*2,-4,'#8a7a6c'); }
  /* a tap on her */
  if(tapT>0){ for(let i=0;i<3;i++){ const k=(16-tapT)+i*3; if(k<0||k>13) continue;
    heart(78+i*7+Math.round(Math.sin(k/2)*1.5), -4-(k>>1)); } }
}

/* ---------- pointer ---------- */
function toPic(clientX,clientY){ const r=view.getBoundingClientRect();
  return {x:(clientX-r.left)/r.width*W, y:(clientY-r.top)/r.height*H-PAD}; }
addEventListener('pointermove',e=>{ ptr=toPic(e.clientX,e.clientY); ptrTTL=e.pointerType==='mouse'?0:24; });
document.documentElement.addEventListener('pointerleave',()=>{ ptr=null; });
addEventListener('blur',()=>{ ptr=null; });
addEventListener('message',e=>{ const d=e.data;
  if(d&&d.type==='cozy-pointer'){ ptr = d.x==null ? null : toPic(d.x,d.y); ptrTTL=0; } });
if(TAP) view.addEventListener('pointerdown',e=>{
  const p=toPic(e.clientX,e.clientY); ptr=p; if(e.pointerType!=='mouse') ptrTTL=24;
  if(p.x>=2&&p.x<=42&&p.y>=42) cats.cal.love=24;
  else if(p.x>=127&&p.y>=45) cats.tab.love=24;
  else tapT=16;
});

/* ---------- loop ---------- */
let scale=4;
function fit(){
  const b=wrap.getBoundingClientRect();
  const w=b.width||W*4, h=b.height||H*4;
  scale = SCALE_Q==='auto' ? Math.max(1,Math.min(14,Math.floor(Math.min(w/W,h/H))))
                           : Math.max(1,Math.min(14,+SCALE_Q||4));
  view.width=W*scale; view.height=H*scale;
  view.style.width=(W*scale)+'px'; view.style.height=(H*scale)+'px';
}
function blit(){ v.imageSmoothingEnabled=false; v.clearRect(0,0,view.width,view.height);
  v.drawImage(off,0,0,W,H,0,0,W*scale,H*scale); }
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let visible=true, acc=0, last=performance.now();
function loop(now){
  const dt=Math.min(now-last,500); last=now;
  if(visible && !reduce){ acc+=dt; const per=1000/FPS; while(acc>=per){ step(); acc-=per; } }
  draw(); blit(); requestAnimationFrame(loop);
}
if('IntersectionObserver' in window)
  new IntersectionObserver(e=>{visible=e[0].isIntersecting},{threshold:.01}).observe(view);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) last=performance.now(); });
addEventListener('resize',fit);
if('ResizeObserver' in window) new ResizeObserver(fit).observe(wrap);
document.body.style.background = BG==='transparent' ? 'transparent' : BG;
view.style.cursor='default';
fit(); draw(); blit(); requestAnimationFrame(loop);
</script>
